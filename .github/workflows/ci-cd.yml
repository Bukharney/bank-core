name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  # ============================================================================
  # 1. Backend CI (Go Test & Vet)
  # ============================================================================
  backend-ci:
    name: Backend CI (Test & Vet)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go Vet
        run: go vet ./...

      - name: Run Go Unit & Race Tests
        run: go test -v -race ./...

  # ============================================================================
  # 2. Frontend CI (Lint & Standalone Build)
  # ============================================================================
  frontend-ci:
    name: Frontend CI (Lint & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Lint
        run: pnpm run lint

      - name: Test Production Build
        run: pnpm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  # ============================================================================
  # 3. Build & Push Multi-Platform Containers to GHCR
  # ============================================================================
  build-and-push:
    name: Build & Push Multi-Platform Containers
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (ARM64 Emulation)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Lowercase repository owner for GHCR compatibility
      - name: Generate image base names
        id: repo-names
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "backend_image=${{ env.REGISTRY }}/${OWNER_LOWER}/bank-core-backend" >> $GITHUB_OUTPUT
          echo "atm_image=${{ env.REGISTRY }}/${OWNER_LOWER}/bank-core-atm" >> $GITHUB_OUTPUT
          echo "frontend_image=${{ env.REGISTRY }}/${OWNER_LOWER}/bank-core-frontend" >> $GITHUB_OUTPUT

      # Backend Image Metadata
      - name: Extract metadata for Backend
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-names.outputs.backend_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      # Build & Push Backend
      - name: Build & Push Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ATM Simulator Image Metadata
      - name: Extract metadata for ATM Simulator
        id: meta-atm
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-names.outputs.atm_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      # Build & Push ATM Simulator
      - name: Build & Push ATM Simulator Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/atm/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta-atm.outputs.tags }}
          labels: ${{ steps.meta-atm.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Image Metadata
      - name: Extract metadata for Frontend
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.repo-names.outputs.frontend_image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-,enable=true

      # Build & Push Frontend
      - name: Build & Push Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' }}
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
